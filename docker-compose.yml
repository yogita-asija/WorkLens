# WorkLens: docker-compose
#
# PHASE 4: MongoDB + the existing monolith (backend/) + the API gateway + auth, notification, AI, messaging, leave and academic services.
#   cp .env.example .env
#   docker compose up --build
#   -> API on http://localhost:8000 (the GATEWAY). The monolith and the services are not published on the host.
#   To use your Atlas database instead of the local MongoDB container, put MONGO_URI=... in .env (see .env.example).
#      Frontend: run `npm run dev` in ./frontend as usual, VITE_API_URL stays http://localhost:8000
#
# Later phases add one block per service (see the commented sections below) and the
# monolith block is removed in Phase 5.

services:
  mongo:
    image: mongo:7
    container_name: worklens-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Existing monolith (removed in Phase 5) ────────────────────────────────
  backend:
    build: ./backend
    container_name: worklens-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      notification-service:
        condition: service_started
    expose:
      - "8000"               # reachable only inside the compose network (the gateway calls http://backend:8000)
    # ports:
    #   - "9000:8000"        # uncomment to call the monolith directly while debugging
    environment:
      PORT: 8000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/worklens}
      NOTIFICATION_URL: http://notification-service:8006
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CLIENT_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      WORKFLOW_ANON_SECRET: ${WORKFLOW_ANON_SECRET:-}

  # ── PHASE 1: API gateway (the only public port) ───────────────────────────
  gateway:
    build: ./gateway
    container_name: worklens-gateway
    restart: unless-stopped
    depends_on:
      - backend
      - auth-service
      - notification-service
      - ai-service
      - messaging-service
      - academic-service
      - leave-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}   # must equal the backend's JWT_SECRET
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MONOLITH_URL: http://backend:8000
      AUTH_URL: http://auth-service:8001
      NOTIFICATION_URL: http://notification-service:8006
      AI_URL: http://ai-service:8007
      MESSAGING_URL: http://messaging-service:8005
      ACADEMIC_URL: http://academic-service:8002
      LEAVE_URL: http://leave-service:8003
      # Phase 5 adds HOD_URL

  # ── PHASE 2: extracted services (not published on the host, only the gateway can reach them) ──
  auth-service:
    build: ./services/auth-service
    container_name: worklens-auth
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8001"
    environment:
      PORT: 8001
      # Same database as the backend for now: the backend still reads the `users` collection directly.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/worklens}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

  notification-service:
    build: ./services/notification-service
    container_name: worklens-notification
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8006"
    environment:
      PORT: 8006
      # Its own database
      MONGO_URI: ${NOTIFICATION_MONGO_URI:-mongodb://mongo:27017/worklens_notification}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}

  ai-service:
    build: ./services/ai-service
    container_name: worklens-ai
    restart: unless-stopped
    expose:
      - "8007"
    environment:
      PORT: 8007
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COURSES_URL: http://backend:8000

  # ── PHASE 3: chat (REST + Socket.IO) ───────────────────────────────────────
  messaging-service:
    build: ./services/messaging-service
    container_name: worklens-messaging
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      auth-service:
        condition: service_started
    expose:
      - "8005"
    environment:
      PORT: 8005
      # Its own database
      MONGO_URI: ${MESSAGING_MONGO_URI:-mongodb://mongo:27017/worklens_messaging}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      AUTH_URL: http://auth-service:8001
      NOTIFICATION_URL: http://notification-service:8006
      CLIENT_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

  # ── PHASE 4: leave and academic. Same database as the backend (the HOD module still reads these collections directly). ──
  leave-service:
    build: ./services/leave-service
    container_name: worklens-leave
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      auth-service:
        condition: service_started
    expose:
      - "8003"
    environment:
      PORT: 8003
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/worklens}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      AUTH_URL: http://auth-service:8001
      NOTIFICATION_URL: http://notification-service:8006

  academic-service:
    build: ./services/academic-service
    container_name: worklens-academic
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      auth-service:
        condition: service_started
    expose:
      - "8002"
    environment:
      PORT: 8002
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/worklens}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      AUTH_URL: http://auth-service:8001
      NOTIFICATION_URL: http://notification-service:8006
      WORKFLOW_ANON_SECRET: ${WORKFLOW_ANON_SECRET:-}

  # ── PHASE 5 ───────────────────────────────────────────────────────────────
  # hod-service:
  #   build: ./services/hod-service
  #   environment: { PORT: 8004, MONGO_URI: "mongodb://mongo:27017/worklens_hod", WORKFLOW_ANON_SECRET: "${WORKFLOW_ANON_SECRET}" }

volumes:
  mongo-data:
